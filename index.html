  <meta http-equiv="refresh" content="0; url=/es/">
  <link rel="canonical" href="https://www.fhi.cl/es/">
  <script>
    (function () {
      var lang = (navigator.language || "es").toLowerCase();
      window.location.replace(lang.indexOf("en") === 0 ? "/en/" : "/es/");
    })();
  </script>
</head>

        <img class="page-loader__logo" src="/assets/logo/fhi-logo-white.svg" alt="FHI" width="112" height="108">
        <span class="page-loader__ring" aria-hidden="true"></span>
      </div>
      <div class="page-loader__bar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <p>Redirecting to <a href="/es/">Español</a> / <a href="/en/">English</a>…</p>
